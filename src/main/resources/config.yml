# CdrStackLimit v0.1.0
# Virtual stacks are currently limited to plain vanilla block items.

stack-limits:
  default: 64
  tiers:
    - permission: cdrstacklimit.stack.256
      limit: 256
    - permission: cdrstacklimit.stack.500
      limit: 500
    - permission: cdrstacklimit.stack.1000
      limit: 1000

behavior:
  reconcile-interval-ticks: 100
  block-container-transfer: true
  blocked-materials:
    - SHULKER_BOX

messages:
  prefix: "&8[&bCdrStackLimit&8] &r"
  container-blocked: "&cVirtual stack tidak bisa dipindahkan ke container/crafting pada versi ini."
  unsafe-click: "&eGunakan klik kiri untuk memindahkan virtual stack. Split, drag, shift-click, dan merge manual diblokir untuk mencegah dupe."
  reloaded: "&aConfig berhasil direload."
  normalized: "&aInventory berhasil dinormalisasi."
  no-permission: "&cKamu tidak punya permission."

ui:
  actionbar: true
  lore: true
